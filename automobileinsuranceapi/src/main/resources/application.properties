spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================== JWT Configuration =====================
# Base64-encoded secret key used to sign JWT tokens (HS256).
# Replace this with your own secret (min 256 bits / 32 bytes before encoding) in production,
# and prefer injecting it via an environment variable instead of committing it to source control.
jwt.secret=dGhpc0lzQVZlcnlMb25nQW5kU2VjdXJlU2VjcmV0S2V5Rm9ySnd0U2lnbmluZ1B1cnBvc2VzT25seTEyMzQ1Ng==

# Token validity in milliseconds - 24 hours
jwt.expiration-ms=86400000

# ===================== Email Configuration =====================
# Quotes, policy documents, and expiry reminders are emailed to users via
# these SMTP settings. Update host/username/password with real credentials
# (e.g. a Gmail address + an "App Password", not your normal Gmail password)
# before relying on email delivery. If left as placeholders, email sends will
# fail gracefully (logged as a warning) without crashing the application.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=email
spring.mail.password=mypassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Master switch: set to false to disable all outbound email attempts
# entirely (useful for local development without SMTP set up).
app.mail.enabled=true
app.mail.from=ashuashuaaa0345@gmail.com

# ===================== Swagger / OpenAPI =====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================== Logging =====================
# Ensures our own application code always logs at INFO level (approvals,
# rejections, emails, scheduled jobs) even if the root level is tuned down.
logging.level.com.hexaware.automobileinsurance=INFO
